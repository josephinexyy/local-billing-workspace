name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check application files and syntax
        run: node scripts/check-project.cjs
      - name: Run business and recovery regression checks
        run: node tests/core.cjs
      - name: Verify reproducible offline build
        run: |
          python3 scripts/build-offline.py
          git diff --exit-code -- dist/Billing-Workspace.html
